[package]
name = "slice-n-shuffle"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "rayon",
] }
clap = { version = "4.6.9", default-features = false, features = [
    "std",
    "derive",
    "color",
    "help",
    "usage",
    "error-context",
    "unicode",
] }
getrandom = { version = "0.4.3", default-features = false, features = [
    "std",
] }
rand = { version = "0.10.4", default-features = false }
rand_xoshiro = { version = "0.8.2", default-features = false }
rayon = { version = "1.12.0", default-features = false }
serde-wasm-bindgen = { version = "0.6.5", default-features = false, optional = true }
serde_with = { version = "3.25.0", default-features = false, features = [
    "macros",
], optional = true }
thiserror = { version = "2.0.21", default-features = false }
wasm-bindgen = { version = "0.2.130", default-features = false, optional = true }

[features]
default = []

js = ["getrandom/wasm_js", "serde_with", "serde-wasm-bindgen", "wasm-bindgen"]
